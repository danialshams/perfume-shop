name: Fertini - cPanel standalone runtime
on:
  pull_request:
    branches: [main]
    paths:
      - 'next.config.ts'
      - 'app/layout.tsx'
      - 'app/page.tsx'
      - 'app/robots.ts'
      - 'app/sitemap.ts'
      - 'app/admin/**'
      - 'components/admin/**'
      - 'components/PanelProductManagementComponents/**'
      - 'lib/fertini-seo.ts'
      - 'server/seo-metadata.ts'
      - 'server/site-content.ts'
      - 'app/api/v1/admin/seo/**'
      - 'app/api/v1/products/**'
      - '.github/workflows/cpanel-standalone.yml'
      - 'server/storage/**'
      - 'app/api/v1/media/**'
      - 'app/api/v1/admin/media-upload/**'
      - 'app/api/v1/uploads/products/**'
      - 'lib/admin-upload-client.ts'
      - 'scripts/test-local-media.mjs'
      - 'app/api/v1/deployment/**'
      - 'scripts/cpanel-pull-deploy.sh'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build portable cPanel runtime (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static security and media checks
        run: |
          node scripts/check-commerce-safety.mjs
          node scripts/check-admin-studio.mjs
          node --experimental-strip-types scripts/test-admin-media.mjs
      - name: Syntax-check cPanel pull deployment script
        run: bash -n scripts/cpanel-pull-deploy.sh
      - name: Verify durable local media storage and path safety
        run: node --experimental-strip-types scripts/test-local-media.mjs
      - name: Build on GitHub, not on the 2 GB shared host
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          APP_URL: https://fertiniperfume.com
          NEXT_PUBLIC_SITE_URL: https://fertiniperfume.com
          TEMP_PUBLIC_ADMIN_EDIT: '0'
          NEXT_PUBLIC_DEPLOY_SHA: ${{ github.sha }}
        run: npm run build
      - name: Assemble host-ready runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          test -d .next/static
          mkdir -p .next/standalone/.next
          cp -a public .next/standalone/public
          cp -a .next/static .next/standalone/.next/static
          # cPanel's app runner uses "npm start"; do not run "next start"
          # because the standalone runtime has only traced dependencies.
          cat > .next/standalone/package.json <<'JSON'
          {
            "name": "fertini-cpanel-runtime",
            "version": "0.1.0",
            "private": true,
            "scripts": { "start": "node server.js" }
          }
          JSON
          test -f .next/standalone/.next/BUILD_ID
          echo "Standalone size (uncompressed):"
          du -sh .next/standalone
      - name: Publish downloadable runtime files (private GitHub artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fertini-cpanel-node24-runtime
          path: .next/standalone/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  publish-cpanel-release:
    name: Publish immutable runtime release for Cron
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fertini-cpanel-node24-runtime
          path: runtime
      - name: Package and checksum host-ready runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s runtime/server.js
          test -s runtime/.next/BUILD_ID
          test -d runtime/.next/static
          tar -czf fertini-runtime.tar.gz -C runtime .
          sha256sum fertini-runtime.tar.gz > fertini-runtime.sha256
          echo "Runtime release size:"
          du -sh fertini-runtime.tar.gz
      - name: Publish only after uploading both assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="fertini-cpanel-${GITHUB_SHA}"
          gh release create "$tag" fertini-runtime.tar.gz fertini-runtime.sha256 \
            --target "$GITHUB_SHA" \
            --title "Fertini cPanel runtime ${GITHUB_SHA:0:12}" \
            --notes "Portable Next.js standalone runtime built and tested on GitHub Actions. No production credentials or database data. Intended for opt-in cPanel Cron deployment." \
            --draft
          gh release edit "$tag" --draft=false --latest
