name: Quiet Luxury visual QA
on:
  push:
    branches:
      - "feature/quiet-luxury-cinematic-20261105"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Cinematic storefront regression
        run: node scripts/check-luxury-ui.mjs
      - name: Lint new visual modules
        run: npx eslint app/layout.tsx app/products/page.tsx components/home-sections/CinematicStorefront.tsx components/home-sections/CinematicPurchasePanel.tsx components/HomeWrapper/home-page-shell.tsx components/HomeProductsPage/LuxuryProductsView.tsx components/NavbarComponents/BrandLogo.tsx
      - name: Isolated bundler smoke (temporary legacy TypeScript override — NOT production release)
        run: |
          node -e 'const fs=require("fs");const p="next.config.ts";let s=fs.readFileSync(p,"utf8");if(!s.includes("const nextConfig: NextConfig = {"))process.exit(2);s=s.replace("const nextConfig: NextConfig = {","const nextConfig: NextConfig = { typescript: { ignoreBuildErrors: true },");fs.writeFileSync(p,s)'
          npm run build
          git checkout -- next.config.ts
      - name: Browser screenshots without Vercel deployment
        run: |
          mkdir -p artifacts
          npm run start -- -p 3100 > /tmp/maison-next.log 2>&1 &
          for attempt in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/ >/dev/null
          if command -v google-chrome >/dev/null; then
            CHROME=google-chrome
          elif command -v chromium >/dev/null; then
            CHROME=chromium
          else
            echo "No Chromium/Google Chrome on runner; screenshots unavailable."
            exit 0
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=7500 --screenshot=artifacts/home-desktop.png http://127.0.0.1:3100/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --virtual-time-budget=7500 --screenshot=artifacts/home-mobile.png http://127.0.0.1:3100/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=7500 --screenshot=artifacts/products-desktop.png http://127.0.0.1:3100/products
      - name: Upload browser preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maison-cinematic-layout-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: TypeScript correctness
        run: npx tsc --noEmit
      - name: Legacy ESLint report (existing errors, not a release gate for the visual phase)
        if: always()
        continue-on-error: true
        run: npm run lint
      - name: Production build
        run: npm run build
