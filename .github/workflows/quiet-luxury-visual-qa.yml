name: Quiet Luxury full production and browser QA
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - feature/quiet-luxury-cinematic-v2-20261105

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test cinematic storefront structure
        run: node scripts/check-luxury-ui.mjs
      - name: Check media audit inventory without database access
        run: node scripts/audit-media-references.mjs
      - name: Lint visual storefront
        run: npx eslint app/layout.tsx app/products/page.tsx app/cart/page.tsx components/home-sections/CinematicStorefront.tsx components/home-sections/CinematicPurchasePanel.tsx components/HomeWrapper/home-page-shell.tsx components/HomeProductsPage/LuxuryProductsView.tsx components/NavbarComponents/BrandLogo.tsx
      - name: Typecheck the complete project
        run: npx tsc --noEmit
      - name: Strict production build (no TypeScript bypass)
        run: npm run build
      - name: Full page browser and responsive QA without Vercel
        run: |
          npm run start -- -p 3100 > /tmp/maison-next.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/ >/dev/null
          if command -v google-chrome >/dev/null; then
            export CHROME=google-chrome
          elif command -v chromium >/dev/null; then
            export CHROME=chromium
          else
            echo "Browser QA requires Chrome/Chromium on the runner."
            exit 1
          fi
          node scripts/verify-visual-browser.mjs
      - name: Upload visual verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maison-fullpage-visual-qa
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Legacy ESLint debt report (not a visual release gate)
        if: always()
        continue-on-error: true
        run: npm run lint
