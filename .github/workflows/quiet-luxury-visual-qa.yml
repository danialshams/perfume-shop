name: Quiet Luxury full production and browser QA
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - feature/quiet-luxury-cinematic-v2-20261105
      - feature/fertini-cinematic-mobile-fixes-20261106
      - feature/fertini-essential-admin-studio-20261106

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test cinematic storefront structure
        run: node scripts/check-luxury-ui.mjs
      - name: Verify V7 mobile layout, controls, stock privacy and real audio
        run: node scripts/check-fertini-v7.mjs
      - name: Validate actual media signatures and file-size boundaries
        run: node --experimental-strip-types scripts/test-admin-media.mjs
      - name: Check admin studio routes, DB migration safety and notification integration
        run: node scripts/check-admin-studio.mjs
      - name: Check media audit inventory without database access
        run: node scripts/audit-media-references.mjs
      - name: Verify payment safety and secret hygiene
        run: node scripts/check-commerce-safety.mjs
      - name: Lint visual storefront
        run: npx eslint app/layout.tsx app/products/page.tsx app/cart/page.tsx components/home-sections/CinematicStorefront.tsx components/home-sections/CinematicPurchasePanel.tsx components/HomeWrapper/home-page-shell.tsx components/HomeProductsPage/LuxuryProductsView.tsx components/NavbarComponents/BrandLogo.tsx components/home-sections/navbar.tsx components/maison/MaisonIntro.tsx components/maison/MaisonAmbientSound.tsx components/maison/MaisonSoundBars.tsx components/maison/FertiniEditorialMotion.tsx components/maison/FertiniFragranceDetail.tsx components/maison/FertiniVoicePlayer.tsx components/home-sections/FertiniHomeV5.tsx components/HomeProductsComponnents/ProductsFilterBar.tsx components/HomeProductsComponnents/ProductsLoadingState.tsx app/demo/fragrance/page.tsx
      - name: Syntax-check safe checkout schema plan
        run: node --check scripts/prepare-mysql-checkout-schema.mjs
      - name: Typecheck the complete project
        run: npx tsc --noEmit
      - name: Strict production build (no TypeScript bypass)
        env:
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: feature/fertini-essential-admin-studio-20261106
        run: npm run build
      - name: Full page browser and responsive QA without Vercel
        env:
          JWT_ACCESS_SECRET: "fertini-ci-only-session-secret-2026-no-production-use"
        run: |
          VERCEL_ENV=preview VERCEL_GIT_COMMIT_REF=feature/fertini-essential-admin-studio-20261106 npm run start -- -p 3100 > /tmp/maison-next.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/ >/dev/null
          if command -v google-chrome >/dev/null; then
            export CHROME=google-chrome
          elif command -v chromium >/dev/null; then
            export CHROME=chromium
          else
            echo "Browser QA requires Chrome/Chromium on the runner."
            exit 1
          fi
          "$CHROME" --version
          node scripts/test-admin-http.mjs
          FERTINI_ADMIN_PREVIEW=1 FERTINI_ADMIN_ONLY=1 timeout 240s node scripts/verify-visual-browser.mjs
          timeout 600s node scripts/verify-visual-browser.mjs
      - name: Upload visual verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maison-fullpage-visual-qa
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Legacy ESLint debt report (not a visual release gate)
        if: always()
        continue-on-error: true
        run: npm run lint

  mysql-checkout-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-checkout-test
          MYSQL_DATABASE: fertini_ci_checkout
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-checkout-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test additive checkout schema in an isolated MySQL database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: fertini_ci_checkout
          DB_USER: root
          DB_PASSWORD: ci-only-checkout-test
          DB_TEST_ALLOW: ci-disposable
        run: node scripts/test-checkout-mysql-ci.mjs
      - name: Test fresh hosted MySQL schema without copying private data
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: ci-only-checkout-test
          DB_TEST_ALLOW: ci-disposable
        run: node scripts/test-fresh-mysql-ci.mjs

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fertini_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fertini_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CI: "true"
      FERTINI_PG_TEST: isolated-disposable
      DATABASE_URL: postgresql://postgres:ci-only-postgres-password@127.0.0.1:5432/fertini_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test PostgreSQL schema and storefront read-write operations
        run: node scripts/test-postgres-ci.mjs
      - name: Verify PostgreSQL release gate
        run: npm run db:verify
