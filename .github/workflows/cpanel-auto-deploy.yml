name: Fertini - optional cPanel SSH deployment
on:
  workflow_run:
    workflows: ["Fertini - cPanel standalone runtime"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: fertini-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Transfer and verify production runtime
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           vars.CPANEL_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      SSH_HOST: ${{ vars.CPANEL_SSH_HOST }}
      SSH_USER: ${{ vars.CPANEL_SSH_USER }}
      SSH_PORT: ${{ vars.CPANEL_SSH_PORT }}
      SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fertini-cpanel-node24-runtime
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runtime
      - name: Configure pin-verified SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_HOST_KEY"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          test -f runtime/server.js
          test -f runtime/.next/BUILD_ID
      - name: Upload bundle to the user's cPanel home
        shell: bash
        run: |
          set -euo pipefail
          tar -czf runtime.tar.gz -C runtime .
          scp -P "${SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            runtime.tar.gz "$SSH_USER@$SSH_HOST:.fertini-upload-$SHA.tgz"
      - name: Promote new runtime, preserving rollback and media
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "bash -s -- promote '$SHA'" < scripts/deploy-cpanel-remote.sh
      - name: Verify new revision served on public domain
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            body="$(curl -fsS --max-time 10 'https://fertiniperfume.com/api/v1/deployment' || true)"
            if printf '%s' "$body" | grep -Fq "\"sha\":\"$SHA\""; then
              echo "Production is running revision $SHA"
              exit 0
            fi
            sleep 4
          done
          echo "New revision was not observed. Confirm that cPanel supports tmp/restart.txt or supply a restart hook." >&2
          exit 1
      - name: Rollback on unsuccessful public verification
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        shell: bash
        run: |
          ssh -p "${SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "bash -s -- rollback '$SHA'" < scripts/deploy-cpanel-remote.sh
